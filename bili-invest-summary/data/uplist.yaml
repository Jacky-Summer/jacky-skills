# B站投资类 UP 主列表
#
# ── 怎么添加 UP 主 ──────────────────────────────
# 在下方 uplist: 下按以下格式添加条目：
#
#   - name: "UP主昵称"      # B站显示名，需与站内一致（uid 为空时按它搜索）
#     uid: "1234567"        # 该UP主的 B站 mid 号（纯数字），建议填写
#     tags: [invest]        # 自定义分组标签；说"投资组"= 抓取 tags 含 invest 的
#     limit: 1              # 可选：该UP主每天只抓最新 1 条视频
#
# uid 获取方式：浏览器打开该UP主的B站个人空间，
# URL 形如 https://space.bilibili.com/1234567 ，其中的数字就是 uid。
# 填了 uid 用它精确抓取视频列表；留空则回退为按昵称搜索。
# ────────────────────────────────────────────────
uplist: []
